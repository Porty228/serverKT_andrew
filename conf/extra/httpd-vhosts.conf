Listen 8080
Listen 8443

<VirtualHost *:8080>
    ServerName campus.local
    ServerAdmin admin@campus.local
    
    DocumentRoot "${CAMPUS_ROOT}/htdocs"
    

    ErrorLog "${CAMPUS_ROOT}/logs/campus_error.log"
    CustomLog "${CAMPUS_ROOT}/logs/campus_access.log" campus_combined
    
  
    Redirect permanent / https://campus.local:8443/
</VirtualHost>

<VirtualHost *:8080>
    ServerName staff.campus.local
    ServerAdmin admin@campus.local
    
    DocumentRoot "${CAMPUS_ROOT}/htdocs"
    
   
    ErrorLog "${CAMPUS_ROOT}/logs/campus_error.log"
    CustomLog "${CAMPUS_ROOT}/logs/campus_access.log" campus_combined
    
   
    Redirect permanent / https://staff.campus.local:8443/
</VirtualHost>

<VirtualHost *:8443>
    ServerName campus.local
    ServerAdmin admin@campus.local
    
    DocumentRoot "${CAMPUS_ROOT}/htdocs"
    
  
    SSLEngine on
    SSLCertificateFile "${CAMPUS_ROOT}/conf/ssl/campus.crt"
    SSLCertificateKeyFile "${CAMPUS_ROOT}/conf/ssl/campus.key"
    
   
    ErrorLog "${CAMPUS_ROOT}/logs/campus_error.log"
    CustomLog "${CAMPUS_ROOT}/logs/campus_access.log" campus_combined
    
   
    <Directory "${CAMPUS_ROOT}/htdocs">
        Options FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>
    

    Redirect permanent /old https://campus.local:8443/new
    
   
    Redirect gone /legacy.html
    

    Alias /static/ "${CAMPUS_ROOT}/assets/"
    <Directory "${CAMPUS_ROOT}/assets">
        Options -Indexes
        AllowOverride None
        Require all granted
        
     
        <IfModule headers_module>
            Header always set Cache-Control "max-age=3600"
        </IfModule>
    </Directory>

    <IfModule headers_module>
        Header always set X-Project "TechCampus"
    </IfModule>
</VirtualHost>

<VirtualHost *:8443>
    ServerName staff.campus.local
    ServerAdmin admin@campus.local
    
    DocumentRoot "${CAMPUS_ROOT}/htdocs"
    

    SSLEngine on
    SSLCertificateFile "${CAMPUS_ROOT}/conf/ssl/campus.crt"
    SSLCertificateKeyFile "${CAMPUS_ROOT}/conf/ssl/campus.key"
    
   
    ErrorLog "${CAMPUS_ROOT}/logs/campus_error.log"
    CustomLog "${CAMPUS_ROOT}/logs/campus_access.log" campus_combined
    
  
    <Directory "${CAMPUS_ROOT}/htdocs">
        Options FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>
  

    Redirect permanent /old https://staff.campus.local:8443/new
    
 
    Redirect gone /legacy.html
    
 
    Alias /static/ "${CAMPUS_ROOT}/assets/"
    <Directory "${CAMPUS_ROOT}/assets">
        Options -Indexes
        AllowOverride None
        Require all granted
        

        <IfModule headers_module>
            Header always set Cache-Control "max-age=3600"
        </IfModule>
    </Directory>
    
 
    Alias /docs "${CAMPUS_ROOT}/secure/docs"
    <Directory "${CAMPUS_ROOT}/secure/docs">
        Options -Indexes
        AllowOverride None
        
    
        AddType text/markdown .md
        
      
        AuthType Basic
        AuthName "TechCampus Staff Area - Authorization Required"
        AuthUserFile "${CAMPUS_ROOT}/conf/users.htpasswd"
        
       
        Require user teacher1 mentor2
        
      
        ErrorDocument 401 /errors/staff-401.html
    </Directory>
 
    <IfModule headers_module>
        Header always set X-Project "TechCampus"
    </IfModule>
</VirtualHost>
